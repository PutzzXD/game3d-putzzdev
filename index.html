<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ff4c00">
  <title>Parkour 3D - Putzzdev</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  
  <style>
    /* --- RESET & DASAR --- */
    body { margin: 0; overflow: hidden; background: #111; touch-action: none; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
    canvas { display: block; }

    /* --- OVERLAY PUTAR HP --- */
    #rotate-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1a1a24; color: white; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; transition: opacity 0.3s;
    }
    #rotate-overlay .icon { font-size: 60px; margin-bottom: 20px; animation: rotate 2s infinite ease-in-out; }
    @keyframes rotate {
      0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); }
    }
    @media (orientation: landscape) { #rotate-overlay { display: none !important; } }

    /* --- UI JOYSTICK (KIRI) --- */
    #joystick-area {
      position: absolute; bottom: 20px; left: 20px;
      width: 160px; height: 160px; z-index: 5; touch-action: none;
    }
    #joystick-zone {
      position: absolute; bottom: 20px; left: 20px;
      width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
      pointer-events: none;
    }
    #joystick-knob {
      position: absolute; top: 50%; left: 50%;
      width: 50px; height: 50px; background: rgba(255, 255, 255, 0.7);
      border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
    }

    /* --- TOMBOL KANAN --- */
    #btn-jump {
      position: absolute; bottom: 40px; right: 40px;
      width: 80px; height: 80px; background: rgba(0, 255, 100, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
      color: white; font-weight: bold; display: flex; align-items: center;
      justify-content: center; user-select: none; font-size: 18px;
      touch-action: none; z-index: 5; cursor: pointer;
    }
    #btn-jump:active { background: rgba(0, 255, 100, 0.9); transform: scale(0.95); }

    #btn-run {
      position: absolute; bottom: 40px; right: 140px;
      width: 70px; height: 70px; background: rgba(255, 59, 59, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
      color: white; font-weight: bold; display: flex; align-items: center;
      justify-content: center; user-select: none; touch-action: none; z-index: 5;
      cursor: pointer;
    }
    #btn-run:active { background: rgba(255, 59, 59, 0.9); transform: scale(0.95); }

    /* --- OVERLAY GAME OVER / WIN --- */
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none; flex-direction: column;
      justify-content: center; align-items: center; color: white;
      font-family: sans-serif; text-align: center; z-index: 10;
    }
    #overlay h1 { margin: 0 0 10px 0; font-size: 40px; }
    #overlay p { margin: 0 0 20px 0; font-size: 18px; }
    #overlay button {
      padding: 10px 30px; font-size: 20px; background: #ff4c00;
      color: white; border: none; border-radius: 8px; font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">
    <div class="icon">📱</div>
    <h2 style="margin:0 0 10px 0;">Putar HP Kamu</h2>
    <p style="margin:0; opacity:0.7;">Mainkan game ini dalam mode Landscape (Miring)</p>
  </div>

  <div id="joystick-area">
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
  </div>

  <div id="btn-jump">LOMPAT</div>
  <div id="btn-run">LARI</div>

  <div id="overlay">
    <h1 id="overlay-title">GAME OVER</h1>
    <p id="overlay-desc">Kamu gagal!</p>
    <button id="btn-restart">COBA LAGI</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="main.js"></script>
</body>
</html>
