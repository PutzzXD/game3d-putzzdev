<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a24">
  <title>Parkour 3D - Akses</title>
  
  <link rel="manifest" href="./manifest.json">
  
  <style>
    /* --- IMPORT FONT MODERN --- */
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

    /* --- DASAR & BACKGROUND --- */
    body { 
      margin: 0; padding: 0; background: #0d0d15; font-family: 'Rajdhani', sans-serif; 
      user-select: none; -webkit-user-select: none; color: white;
      display: flex; justify-content: center; align-items: center; 
      min-height: 100vh; overflow: hidden;
      background-image: radial-gradient(circle at 50% 0%, #2a1b41 0%, #0d0d15 70%);
    }

    /* --- KONTAINER UTAMA --- */
    #auth-container {
      width: 90%; max-width: 400px; 
      display: flex; flex-direction: column; align-items: center;
      position: relative; z-index: 100;
    }

    /* --- LOGO & JUDUL --- */
    .logo-area { text-align: center; margin-bottom: 30px; }
    .logo-box {
      width: 80px; height: 80px; background: #9d4edd; border-radius: 20px;
      display: flex; justify-content: center; align-items: center;
      margin: 0 auto 15px auto; box-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
    }
    .logo-box svg { width: 45px; height: 45px; fill: white; }
    .logo-area h1 { margin: 0; font-size: 32px; letter-spacing: 2px; color: #e0aaff; text-shadow: 0 0 10px #9d4edd; }
    .logo-area p { margin: 5px 0 0 0; font-size: 12px; color: #888; letter-spacing: 1px; }
    .logo-area p span { color: #e0aaff; font-weight: bold; }

    /* --- STATUS ONLINE --- */
    .status-online {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(0, 255, 0, 0.1); border: 1px solid rgba(0, 255, 0, 0.3);
      padding: 5px 15px; border-radius: 20px; font-size: 12px; color: #00ff00; margin-top: 15px;
    }
    .status-dot { width: 8px; height: 8px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00; }

    /* --- TAB MENU (MASUK / DAFTAR) --- */
    .tab-container {
      display: flex; width: 100%; background: #11111a; border-radius: 15px;
      padding: 5px; margin-bottom: 25px; border: 1px solid #333;
    }
    .tab-btn {
      flex: 1; padding: 12px; border: none; background: transparent; color: #888;
      font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: bold; letter-spacing: 1px;
      cursor: pointer; border-radius: 10px; transition: 0.3s;
    }
    .tab-btn.active {
      background: #9d4edd; color: white; box-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
    }

    /* --- FORM AREA --- */
    .form-box { width: 100%; display: none; flex-direction: column; }
    .form-box.active { display: flex; }

    /* --- INPUT GROUP --- */
    .input-group { margin-bottom: 15px; }
    .input-group label {
      display: block; font-size: 12px; color: #9d4edd; font-weight: bold; letter-spacing: 1px; margin-bottom: 5px;
    }
    .input-wrapper {
      display: flex; align-items: center; background: #11111a; 
      border: 1px solid #333; border-radius: 12px; padding: 0 15px; transition: 0.3s;
    }
    .input-wrapper:focus-within { border-color: #9d4edd; box-shadow: 0 0 10px rgba(157, 78, 221, 0.2); }
    .input-wrapper .icon { font-size: 18px; margin-right: 10px; }
    .input-wrapper input {
      flex: 1; background: transparent; border: none; outline: none;
      color: white; font-family: 'Rajdhani', sans-serif; font-size: 16px; padding: 15px 0;
    }
    .input-wrapper input::placeholder { color: #555; }

    /* --- TOMBOL UTAMA --- */
    .btn-submit {
      width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 12px;
      background: linear-gradient(90deg, #7b2cbf, #9d4edd); color: white;
      font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: bold; letter-spacing: 1px;
      cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(157, 78, 221, 0.4);
    }
    .btn-submit:active { transform: scale(0.97); }
    .btn-submit:disabled { background: #333; box-shadow: none; cursor: not-allowed; }

    /* --- PESAN ERROR/SUKSES --- */
    .msg { font-size: 14px; text-align: center; margin-top: 15px; height: 20px; font-weight: bold; }
    .msg.error { color: #ff3333; }
    .msg.success { color: #00ff00; }
  </style>
</head>
<body>
  
  <div id="auth-container">
    
    <!-- LOGO & JUDUL -->
    <div class="logo-area">
      <div class="logo-box">
        <!-- Icon Runner (SVG) -->
        <svg viewBox="0 0 24 24"><path d="M13.5,5.5c1.1,0,2-0.9,2-2s-0.9-2-2-2s-2,0.9-2,2S12.4,5.5,13.5,5.5z M9.8,8.9L7,23h2.1l1.8-8l2.1,2v6h2v-7.5l-2.1-2l0.6-3C14.8,12,16.8,13,19,13v-2c-1.9,0-3.5-1-4.3-2.4l-1-1.6c-0.4-0.6-1-1-1.7-1c-0.3,0-0.5,0.1-0.8,0.1L6,8.3V13h2V9.6l1.8-0.7z"/></svg>
      </div>
      <h1>PARKOUR 3D</h1>
      <p>DEVELOPED BY <span>PUTZZDEV</span></p>
      
      <div class="status-online">
        <div class="status-dot"></div>
        <span id="online-count">Server Aktif</span>
      </div>
    </div>

    <!-- TAB MENU -->
    <div class="tab-container">
      <button class="tab-btn active" id="tab-login">MASUK</button>
      <button class="tab-btn" id="tab-register">DAFTAR</button>
    </div>

    <!-- FORM LOGIN -->
    <div class="form-box active" id="form-login">
      <div class="input-group">
        <label>👤 USERNAME</label>
        <div class="input-wrapper">
          <span class="icon">👤</span>
          <input type="text" id="login-username" placeholder="Username kamu..." maxlength="15" autocomplete="off">
        </div>
      </div>
      <div class="input-group">
        <label>🔒 PIN (6 ANGKA)</label>
        <div class="input-wrapper">
          <span class="icon">🔑</span>
          <input type="password" id="login-pin" placeholder="Masukkan PIN..." maxlength="6" inputmode="numeric" autocomplete="off">
        </div>
      </div>
      <button class="btn-submit" id="btn-login">MASUK GAME</button>
      <div class="msg" id="login-msg"></div>
    </div>

    <!-- FORM REGISTRASI -->
    <div class="form-box" id="form-register">
      <div class="input-group">
        <label>👤 USERNAME BARU</label>
        <div class="input-wrapper">
          <span class="icon">👤</span>
          <input type="text" id="reg-username" placeholder="Buat username..." maxlength="15" autocomplete="off">
        </div>
      </div>
      <div class="input-group">
        <label>🔒 BUAT PIN (6 ANGKA)</label>
        <div class="input-wrapper">
          <span class="icon">🔑</span>
          <input type="password" id="reg-pin" placeholder="Buat PIN..." maxlength="6" inputmode="numeric" autocomplete="off">
        </div>
      </div>
      <div class="input-group">
        <label>🔒 KONFIRMASI PIN</label>
        <div class="input-wrapper">
          <span class="icon">🔑</span>
          <input type="password" id="reg-pin-confirm" placeholder="Ulangi PIN..." maxlength="6" inputmode="numeric" autocomplete="off">
        </div>
      </div>
      <button class="btn-submit" id="btn-register">DAFTAR AKUN</button>
      <div class="msg" id="reg-msg"></div>
    </div>

  </div>

  <script type="module" src="main.js"></script>>
</body>
</html>
