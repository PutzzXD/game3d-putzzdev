<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a24">
  <title>Parkour 3D - Akses</title>
  
  <link rel="manifest" href="./manifest.json">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

    * { box-sizing: border-box; }
    body { 
      margin: 0; padding: 0; background: #0d0d15; font-family: 'Rajdhani', sans-serif; 
      user-select: none; -webkit-user-select: none; color: white;
      display: flex; justify-content: center; align-items: center; 
      min-height: 100vh; overflow-y: auto; overflow-x: hidden;
      background-image: radial-gradient(circle at 50% 0%, #2a1b41 0%, #0d0d15 70%);
    }

    /* --- UI LOGIN --- */
    #auth-container { width: 90%; max-width: 400px; display: flex; flex-direction: column; align-items: center; z-index: 100; padding: 20px 0;}
    .logo-area { text-align: center; margin-bottom: 20px; }
    .logo-box { width: 70px; height: 70px; background: #9d4edd; border-radius: 20px; display: flex; justify-content: center; align-items: center; margin: 0 auto 10px auto; box-shadow: 0 0 20px rgba(157, 78, 221, 0.5); }
    .logo-box svg { width: 40px; height: 40px; fill: white; }
    .logo-area h1 { margin: 0; font-size: 28px; letter-spacing: 2px; color: #e0aaff; text-shadow: 0 0 10px #9d4edd; }
    .logo-area p { margin: 5px 0 0 0; font-size: 12px; color: #888; letter-spacing: 1px; }
    .logo-area p span { color: #e0aaff; font-weight: bold; }

    .status-online { display: inline-flex; align-items: center; gap: 8px; background: rgba(0, 255, 0, 0.1); border: 1px solid rgba(0, 255, 0, 0.3); padding: 5px 15px; border-radius: 20px; font-size: 12px; color: #00ff00; margin-top: 10px; font-weight: bold; }
    .status-dot { width: 8px; height: 8px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00; }

    .tabs { display: flex; width: 100%; margin-bottom: 20px; position: relative; z-index: 999; }
    .tabs input[type="radio"] { display: none; }
    .tab-label { flex: 1; text-align: center; padding: 12px; background: #11111a; border: 1px solid #333; color: #888; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .tab-label:first-of-type { border-radius: 12px 0 0 12px; }
    .tab-label:last-of-type { border-radius: 0 12px 12px 0; }
    #tab1:checked ~ .tabs .tab-label[for="tab1"], #tab2:checked ~ .tabs .tab-label[for="tab2"] { background: #9d4edd; color: white; border-color: #9d4edd; box-shadow: 0 0 15px rgba(157, 78, 221, 0.4); }

    .form-container { width: 100%; position: relative; z-index: 1; }
    .form-box { width: 100%; display: none; flex-direction: column; }
    #tab1:checked ~ .form-container #form-login { display: flex; }
    #tab2:checked ~ .form-container #form-register { display: flex; }

    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; color: #9d4edd; font-weight: bold; margin-bottom: 5px; }
    .input-wrapper { display: flex; align-items: center; background: #11111a; border: 1px solid #333; border-radius: 12px; padding: 0 15px; transition: 0.3s; }
    .input-wrapper:focus-within { border-color: #9d4edd; }
    .input-wrapper .icon { font-size: 18px; margin-right: 10px; }
    .input-wrapper input { flex: 1; background: transparent; border: none; outline: none; color: white; font-family: 'Rajdhani', sans-serif; font-size: 16px; padding: 12px 0; }
    
    .btn-submit { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 12px; background: linear-gradient(90deg, #7b2cbf, #9d4edd); color: white; font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(157, 78, 221, 0.4); transition: 0.2s; }
    .btn-submit:active { transform: scale(0.97); }
    .btn-submit:disabled { background: #333; box-shadow: none; cursor: not-allowed; }
    
    .msg { font-size: 14px; text-align: center; margin-top: 10px; height: 20px; font-weight: bold; }
    .msg.error { color: #ff3333; }
    .msg.success { color: #00ff00; }

    /* --- UI LOBBY & GAME --- */
    #game-ui { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; }
    
    /* Top HUD (Kiri Atas) */
    #top-hud { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; gap: 10px; pointer-events: auto; }
    #btn-profile { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; color: white; font-weight: bold; font-family: sans-serif; font-size: 16px; cursor: pointer; border: 1px solid #555; transition: 0.2s; }
    #btn-profile:active { transform: scale(0.95); }
    #hud-verified { display: none; width: 18px; height: 18px; background: #1DA1F2; border-radius: 50%; align-items: center; justify-content: center; font-size: 12px; color: white; }

    /* Koin (Kanan Atas) */
    #coin-hud { position: absolute; top: 15px; right: 15px; z-index: 10; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; color: #ffd700; font-weight: bold; font-family: sans-serif; font-size: 18px; border: 1px solid #ffd700; display: flex; align-items: center; gap: 5px; pointer-events: auto; }
    #coin-icon { font-size: 20px; }

    /* Modal Profil */
    #profile-modal { position: absolute; top: 60px; left: 15px; background: #22222e; border: 1px solid #444; border-radius: 12px; padding: 20px; color: white; z-index: 20; width: 250px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); pointer-events: auto; display: none; }
    #profile-modal h3 { margin: 0 0 10px 0; color: #e0aaff; border-bottom: 1px solid #444; padding-bottom: 5px; display: flex; justify-content: space-between; }
    #close-modal { cursor: pointer; color: #ff3333; font-weight: bold; }
    #profile-modal p { margin: 5px 0; font-size: 14px; color: #ccc; }
    #profile-modal .dev-badge { color: #1DA1F2; font-weight: bold; }
    .btn-logout { width: 100%; padding: 10px; margin-top: 15px; background: #ff3333; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: sans-serif; }

    /* --- UI SHOP MODAL --- */
    #shop-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a24; border: 2px solid #9d4edd; border-radius: 15px; width: 90%; max-width: 600px; padding: 20px; z-index: 50; display: none; flex-direction: column; pointer-events: auto; box-shadow: 0 0 30px rgba(157,78,221,0.3); max-height: 80vh; overflow-y: auto; }
    #shop-modal h2 { margin: 0 0 15px 0; text-align: center; color: #e0aaff; font-family: 'Rajdhani', sans-serif; letter-spacing: 2px; }
    .shop-tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
    .shop-tab-btn { padding: 8px 15px; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: sans-serif; font-weight: bold; }
    .shop-tab-btn.active { background: #9d4edd; }
    .shop-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .shop-item { background: #22222e; border: 1px solid #444; border-radius: 10px; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .shop-item .color-preview { width: 50px; height: 50px; border-radius: 50%; margin: 0 auto 10px auto; border: 2px solid #fff; }
    .shop-item .item-name { font-weight: bold; font-size: 14px; margin-bottom: 5px; font-family: sans-serif; }
    .shop-item .item-price { color: #ffd700; font-size: 14px; font-weight: bold; margin-bottom: 10px; font-family: sans-serif; }
    .shop-buy-btn { background: #00ff00; color: black; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: sans-serif; width: 100%; }
    .shop-buy-btn:disabled { background: #555; color: #999; cursor: not-allowed; }
    .btn-close-shop { position: absolute; top: 15px; right: 20px; font-size: 20px; font-weight: bold; color: #ff3333; cursor: pointer; }

    /* Tombol Shop & Mulai (Kanan Bawah) */
    #bottom-controls { position: absolute; bottom: 40px; right: 40px; display: flex; gap: 15px; align-items: flex-end; z-index: 10; pointer-events: auto; }
    #btn-shop { width: 80px; height: 80px; background: linear-gradient(135deg, #ffd700, #ff8c00); color: black; border: 3px solid white; border-radius: 50%; font-size: 30px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
    #btn-shop:active { transform: scale(0.95); }
    #btn-start-game { width: 120px; height: 60px; background: #00ff00; color: black; border: 3px solid white; border-radius: 15px; font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 20px rgba(0, 255, 0, 0.5); }
    #btn-start-game:active { transform: scale(0.95); }

    /* Kontrol Game */
    #in-game-controls { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; }
    #joystick-area { position: absolute; bottom: 20px; left: 20px; width: 160px; height: 160px; z-index: 5; touch-action: none; pointer-events: auto; }
    #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; pointer-events: none; }
    #joystick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.7); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    #btn-jump { position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; background: rgba(0, 255, 100, 0.6); border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; font-size: 18px; touch-action: none; z-index: 5; cursor: pointer; pointer-events: auto; font-family: sans-serif;}
    #btn-jump:active { background: rgba(0, 255, 100, 0.9); transform: scale(0.95); }
    #btn-run { position: absolute; bottom: 40px; right: 140px; width: 70px; height: 70px; background: rgba(255, 59, 59, 0.6); border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none; z-index: 5; cursor: pointer; pointer-events: auto; font-family: sans-serif;}
    #btn-run:active { background: rgba(255, 59, 59, 0.9); transform: scale(0.95); }

    /* Overlay Game Over */
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: sans-serif; text-align: center; z-index: 30; pointer-events: auto; }
    #overlay h1 { margin: 0 0 10px 0; font-size: 40px; }
    #overlay p { margin: 0 0 20px 0; font-size: 18px; }
    #overlay button { padding: 10px 30px; font-size: 20px; background: #ff4c00; color: white; border: none; border-radius: 8px; font-weight: bold; }

    /* Overlay Putar HP */
    #rotate-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a24; color: white; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity 0.3s; }
    #rotate-overlay .icon { font-size: 60px; margin-bottom: 20px; animation: rotate 2s infinite ease-in-out; }
    @keyframes rotate { 0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
    @media (orientation: landscape) { #rotate-overlay { display: none !important; } }

    /* Chat */
    #chat-container { position: absolute; top: 70px; left: 15px; width: 280px; z-index: 15; pointer-events: auto; display: flex; flex-direction: column; }
    #chat-toggle { background: #9d4edd; color: white; border: 2px solid white; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; align-self: flex-start; margin-bottom: 5px; font-family: sans-serif; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    #chat-box { background: rgba(0,0,0,0.85); border: 1px solid #555; border-radius: 10px; display: none; flex-direction: column; height: 180px; backdrop-filter: blur(5px); margin-top: 5px;}
    #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
    .chat-msg { word-wrap: break-word; line-height: 1.2; }
    .chat-msg .name { font-weight: bold; color: #e0aaff; }
    .chat-msg .name.dev { color: #1DA1F2; }
    .chat-msg .text { color: #ddd; }
    #chat-input-area { display: flex; border-top: 1px solid #444; padding: 5px; }
    #chat-input { flex: 1; background: transparent; border: none; color: white; padding: 5px; outline: none; font-family: sans-serif; font-size: 13px; }
    #chat-send { background: #9d4edd; border: none; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }

    /* --- NOTIFIKASI CUSTOM (TOAST) --- */
    #custom-toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      background: rgba(20, 20, 30, 0.95); border: 2px solid #9d4edd; border-radius: 15px;
      padding: 20px 40px; color: white; font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: bold;
      z-index: 99999; display: none; opacity: 0; transition: all 0.3s ease; text-align: center;
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.6); pointer-events: none;
    }
    #custom-toast.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>
  
  <!-- LAYAR LOGIN / DAFTAR -->
  <div id="auth-container">
    <div class="logo-area">
      <div class="logo-box"><svg viewBox="0 0 24 24"><path d="M13.5,5.5c1.1,0,2-0.9,2-2s-0.9-2-2-2s-2,0.9-2,2S12.4,5.5,13.5,5.5z M9.8,8.9L7,23h2.1l1.8-8l2.1,2v6h2v-7.5l-2.1-2l0.6-3C14.8,12,16.8,13,19,13v-2c-1.9,0-3.5-1-4.3-2.4l-1-1.6c-0.4-0.6-1-1-1.7-1c-0.3,0-0.5,0.1-0.8,0.1L6,8.3V13h2V9.6l1.8-0.7z"/></svg></div>
      <h1>PARKOUR 3D</h1>
      <p>DEVELOPED BY <span>PUTZZDEV</span></p>
      <div class="status-online"><div class="status-dot"></div><span>Server Aktif</span></div>
    </div>

    <input type="radio" name="tabs" id="tab1" checked>
    <input type="radio" name="tabs" id="tab2">

    <div class="tabs">
      <label class="tab-label" for="tab1">MASUK</label>
      <label class="tab-label" for="tab2">DAFTAR</label>
    </div>

    <div class="form-container">
      <!-- LOGIN -->
      <div class="form-box" id="form-login">
        <div class="input-group"><label>👤 USERNAME</label><div class="input-wrapper"><span class="icon">👤</span><input type="text" id="login-username" placeholder="Username kamu..." maxlength="15" autocomplete="off"></div></div>
        <div class="input-group"><label>🔒 PIN (6 ANGKA)</label><div class="input-wrapper"><span class="icon">🔑</span><input type="password" id="login-pin" placeholder="Masukkan PIN..." maxlength="6" inputmode="numeric" autocomplete="off"></div></div>
        <button class="btn-submit" id="btn-login" type="button">MASUK LOBI</button>
        <div class="msg" id="login-msg"></div>
      </div>
      <!-- DAFTAR -->
      <div class="form-box" id="form-register">
        <div class="input-group"><label>👤 USERNAME BARU</label><div class="input-wrapper"><span class="icon">👤</span><input type="text" id="reg-username" placeholder="Buat username..." maxlength="15" autocomplete="off"></div></div>
        <div class="input-group"><label>🔒 BUAT PIN</label><div class="input-wrapper"><span class="icon">🔑</span><input type="password" id="reg-pin" placeholder="Buat PIN..." maxlength="6" inputmode="numeric" autocomplete="off"></div></div>
        <div class="input-group"><label>🔒 KONFIRMASI PIN</label><div class="input-wrapper"><span class="icon">🔑</span><input type="password" id="reg-pin-confirm" placeholder="Ulangi PIN..." maxlength="6" inputmode="numeric" autocomplete="off"></div></div>
        <button class="btn-submit" id="btn-register" type="button">DAFTAR AKUN</button>
        <div class="msg" id="reg-msg"></div>
      </div>
    </div>
  </div>

  <!-- LAYAR GAME 3D -->
  <div id="game-ui">
    
    <div id="top-hud">
      <div id="btn-profile">
        <span id="hud-username">Player</span>
        <div id="hud-verified">✔</div>
      </div>
    </div>
    
    <div id="coin-hud">
      <span id="coin-icon">🪙</span>
      <span id="coin-amount">0</span>
    </div>

    <div id="chat-container">
      <button id="chat-toggle">💬 Chat Global</button>
      <div id="chat-box">
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <input type="text" id="chat-input" placeholder="Ketik pesan..." maxlength="50" autocomplete="off">
          <button id="chat-send">Kirim</button>
        </div>
      </div>
    </div>

    <div id="profile-modal">
      <h3>INFO AKUN <span id="close-modal">✖</span></h3>
      <p>Username: <b id="modal-username">Player</b></p>
      <p>Status: <span id="modal-status" class="dev-badge">Player Biasa</span></p>
      <button class="btn-logout" id="btn-logout">LOGOUT</button>
    </div>

    <div id="shop-modal">
      <span class="btn-close-shop" id="close-shop">✖</span>
      <h2>🛒 TOKO KARAKTER</h2>
      <div class="shop-tabs" id="shop-tabs-container">
        <button class="shop-tab-btn active" data-cat="baju">Baju</button>
        <button class="shop-tab-btn" data-cat="celana">Celana</button>
        <button class="shop-tab-btn" data-cat="sepatu">Sepatu</button>
        <button class="shop-tab-btn" data-cat="efek">Efek</button>
      </div>
      <div class="shop-items" id="shop-items-container"></div>
    </div>

    <div id="bottom-controls">
      <div id="btn-shop" style="display: none;">🛒</div>
      <div id="btn-start-game" style="display: flex;">MULAI</div>
    </div>

    <div id="in-game-controls">
      <div id="joystick-area"><div id="joystick-zone"><div id="joystick-knob"></div></div></div>
      <div id="btn-jump">LOMPAT</div>
      <div id="btn-run">LARI</div>
    </div>

    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <h2 style="margin:0 0 10px 0;">Putar HP Kamu</h2>
      <p style="margin:0; opacity:0.7;">Mainkan game ini dalam mode Landscape (Miring)</p>
    </div>

    <div id="overlay">
      <h1 id="overlay-title">GAME OVER</h1>
      <p id="overlay-desc">Kamu gagal!</p>
      <button id="btn-restart" type="button">COBA LAGI</button>
    </div>
  </div>

  <!-- Toast Element -->
  <div id="custom-toast"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
